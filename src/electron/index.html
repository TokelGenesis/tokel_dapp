<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tokel Platform</title>
    <script>
      (() => {
        if (process?.env?.NODE_ENV !== 'development') {
          // Restrict what the packaged app can load/connect to. Applied only in
          // production because dev serves the renderer over http://localhost.
          // This runs before the body <script> is parsed, so it covers it.
          const csp = document.createElement('meta');
          csp.httpEquiv = 'Content-Security-Policy';
          csp.content =
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-src 'self';";
          document.getElementsByTagName('head')[0].appendChild(csp);

          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './dist/style.css';
          // HACK: Writing the script path should be done with webpack
          document.getElementsByTagName('head')[0].appendChild(link);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const scripts = [];

      if (process.env.NODE_ENV === 'development') {
        // Dynamically insert the DLL script in development env in the
        // renderer process
        scripts.push('../../config/dll/renderer.dev.dll.js');

        // Dynamically insert the bundled app script in the renderer process
        const port = process.env.PORT || 1212;
        scripts.push(`http://localhost:${port}/dist/renderer.dev.js`);
      } else {
        scripts.push('./dist/renderer.js');
      }

      if (scripts.length) {
        document.write(
          scripts
            .map((script) => `<script defer src="${script}"><\/script>`)
            .join('')
        );
      }
    </script>
  </body>
</html>
