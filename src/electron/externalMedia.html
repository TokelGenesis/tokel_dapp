<html>
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src https: data:; media-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      .loading {
        width: 200px;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loading > div {
        height: 30px;
        width: 30px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        background: linear-gradient(0deg, rgba(63, 249, 220, 0.1) 33%, #3ff9dc 100%);
        animation: spin 0.8s linear 0s infinite;
      }

      .loading > div > span {
        width: 90%;
        height: 90%;
        background-color: hsla(214, 32%, 18%, 1);
        border-radius: 50%;
      }

      #mediaWrapper {
        max-width: 40px;
        height: 100%;
        display: flex;
      }

      #mediaWrapper > img,
      video,
      audio {
        margin-top: auto;
        margin-bottom: auto;
      }

      @keyframes spin {
        from {
          transform: rotate(0);
        }

        to {
          transform: rotate(359deg);
        }
      }
    </style>
    <script type="text/javascript">
      window.onload = function () {
        const wrapper = window.document.getElementById('mediaWrapper');

        // Media URLs come from on-chain token data, which anyone can write.
        // Only ever load https or data: URLs, and never build markup from the
        // URL string (which would allow HTML/attribute injection) - create the
        // element and assign .src, which cannot break out into markup.
        const isSafeMediaUrl = url => {
          try {
            const scheme = new URL(url).protocol;
            return scheme === 'https:' || scheme === 'data:';
          } catch (e) {
            return false;
          }
        };

        const showSpinner = () => {
          wrapper.replaceChildren();
          const loading = window.document.createElement('div');
          loading.className = 'loading';
          const inner = window.document.createElement('div');
          inner.appendChild(window.document.createElement('span'));
          loading.appendChild(inner);
          wrapper.appendChild(loading);
        };

        const renderMedia = (tag, mediaUrl) => {
          wrapper.replaceChildren();
          const el = window.document.createElement(tag);
          el.setAttribute('width', '100%');
          el.setAttribute('height', 'auto');
          if (tag === 'video') {
            el.muted = true;
            el.autoplay = true;
            el.loop = true;
            el.controls = true;
          } else if (tag === 'audio') {
            el.controls = true;
          }
          el.src = mediaUrl;
          wrapper.appendChild(el);
        };

        window.addEventListener(
          'message',
          async event => {
            const mediaUrl = event.data.mediaUrl;
            const width = event.data.width;

            wrapper.style.maxWidth = width > 0 ? `${width}px` : undefined;

            if (!mediaUrl || !mediaUrl.length) {
              showSpinner();
              return;
            }

            if (!isSafeMediaUrl(mediaUrl)) {
              wrapper.replaceChildren();
              return;
            }

            try {
              let mediaType = (await fetch(mediaUrl, { method: 'HEAD' })).headers
                .get('content-type')
                ?.split('/')?.[0];

              if (!mediaType)
                mediaType = (await fetch(mediaUrl, { method: 'GET' })).headers
                  .get('content-type')
                  ?.split('/')?.[0];

              if (mediaType?.includes('image')) {
                renderMedia('img', mediaUrl);
              } else if (mediaType?.includes('video')) {
                renderMedia('video', mediaUrl);
              } else if (mediaType?.includes('audio')) {
                renderMedia('audio', mediaUrl);
              } else {
                wrapper.replaceChildren();
              }
            } catch (error) {
              console.error(error);
              wrapper.replaceChildren();
            }
          },
          false
        );
      };
    </script>
  </head>

  <body>
    <div id="mediaWrapper">
      <div class="loading">
        <div><span /></div>
      </div>
    </div>
  </body>
</html>
